<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prop sheet</title>
    <style>
      body { background: #14161a; color: #b7ae9d; font: 12px monospace; margin: 16px; }
      .grid { display: flex; flex-wrap: wrap; gap: 14px; }
      figure { margin: 0; text-align: center; width: 132px; }
      canvas { image-rendering: pixelated; background: #23272e; border: 1px solid #333; }
      figcaption { margin-top: 4px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <!--
      A dev-only look at every prop texture, magnified.

      The textures are drawn in code at 8-26px and then seen on a street at a camera standoff of
      22 units, which is exactly the size at which you cannot tell whether a thing is drawn well
      or merely drawn. This page is the only way to see them as the artist would.
    -->
    <h1 style="font-size: 14px">Dressing — every kind, at 6x</h1>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { DRESSING_ART, makeWaystoneTexture } from '/src/district/textures.ts';
      import { DRESSING } from '/src/district/dressing.ts';

      const grid = document.getElementById('grid');
      const SCALE = 6;

      const show = (name, tex) => {
        const src = tex.image;
        const fig = document.createElement('figure');
        const c = document.createElement('canvas');
        c.width = src.width * SCALE;
        c.height = src.height * SCALE;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(src, 0, 0, c.width, c.height);
        const cap = document.createElement('figcaption');
        cap.textContent = `${name} ${src.width}x${src.height} · ${DRESSING[name]?.form ?? 'panel'}`;
        fig.append(c, cap);
        grid.append(fig);
      };

      for (const [name, make] of Object.entries(DRESSING_ART)) show(name, make());
      show('waystone', makeWaystoneTexture('MILLHARROW — III'));
    </script>
  </body>
</html>
