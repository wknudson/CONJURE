<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HD-2D Starter</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131a; }
  canvas { display: block; }
  #help {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: #cfd6e4; background: rgba(16,19,26,.72);
    padding: 10px 12px; border: 1px solid rgba(207,214,228,.18); border-radius: 6px;
    pointer-events: none; white-space: pre;
  }
</style>

<!--
  Dependency map. All version-locked so the file keeps working.
  'three/addons/' must match the three version exactly.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js"
  }
}
</script>
</head>
<body>
<div id="help">WASD / arrows - move
Q / E - orbit camera
Space - impact light (VFX test)
Panel (top right) - tune the look</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import GUI from 'lil-gui';

/* ============================================================
   0. TUNABLE LOOK PARAMETERS
   Every value that defines "the HD-2D feel" lives here so you can
   tune it live in the GUI, then paste the numbers back into code.
   ============================================================ */
const LOOK = {
  // Camera — narrow FOV is what makes the world read as a diorama.
  fov: 30,
  cameraPitch: 42,      // degrees below horizontal
  cameraDistance: 14,

  // Lighting
  sunIntensity: 1.5,
  sunColor: '#ffe6bd',
  ambientIntensity: 0.55,
  skyColor: '#9dc0ff',
  groundBounce: '#453425',

  // Atmosphere
  fogColor: '#1b2436',
  fogDensity: 0.022,

  // Bloom
  bloomStrength: 0.55,
  bloomRadius: 0.6,
  bloomThreshold: 0.55,

  // Tilt-shift (the "toy miniature" blur)
  tiltEnabled: true,
  tiltFocusCenter: 0.52,  // 0 = top of screen, 1 = bottom
  tiltFocusWidth: 0.14,   // half-height of the sharp band
  tiltFalloff: 0.22,      // how fast blur ramps outside the band
  tiltMaxBlur: 3.2,       // in pixels

  // Impact light (per-VFX point light, the Octopath combat trick)
  impactColor: '#ffb347',
  impactIntensity: 40,
  impactDistance: 9,
  impactDecayTime: 0.45,
};

/* ============================================================
   1. RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(LOOK.fogColor, LOOK.fogDensity);
scene.background = new THREE.Color(LOOK.fogColor);

const camera = new THREE.PerspectiveCamera(LOOK.fov, innerWidth / innerHeight, 0.1, 200);

/* ============================================================
   2. PLACEHOLDER PIXEL ART
   Generated on a canvas so this file runs with zero assets.
   Replace every one of these with your own loaded textures —
   see loadPixelTexture() at the bottom of this section.
   ============================================================ */

// The single most important setting for pixel art in 3D.
function configurePixelTexture(tex) {
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Use this for your real art:  const t = loadPixelTexture('/sprites/hero.png');
const texLoader = new THREE.TextureLoader();
function loadPixelTexture(url) {
  return configurePixelTexture(texLoader.load(url));
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return { c, ctx };
}

function canvasTexture(canvas) {
  return configurePixelTexture(new THREE.CanvasTexture(canvas));
}

// --- placeholder character, 4 facings ---
function makeCharacterTexture(facing) {
  const { c, ctx } = makeCanvas(16, 22);
  const skin = '#f0c8a0', hair = '#5b3a29', cloak = '#3f7bbf', trim = '#e0d2a8', boot = '#2e2419';

  ctx.fillStyle = cloak; ctx.fillRect(4, 10, 8, 8);       // torso
  ctx.fillStyle = trim;  ctx.fillRect(4, 17, 8, 1);       // hem
  ctx.fillStyle = boot;  ctx.fillRect(5, 18, 2, 4); ctx.fillRect(9, 18, 2, 4);
  ctx.fillStyle = skin;  ctx.fillRect(5, 3, 6, 7);        // head

  if (facing === 'up') {
    ctx.fillStyle = hair; ctx.fillRect(4, 2, 8, 8);       // back of head
  } else if (facing === 'left' || facing === 'right') {
    ctx.fillStyle = hair; ctx.fillRect(4, 2, 8, 4);
    ctx.fillStyle = '#20242e';
    ctx.fillRect(facing === 'left' ? 5 : 9, 6, 2, 2);     // one eye in profile
    ctx.fillStyle = skin; ctx.fillRect(facing === 'left' ? 3 : 12, 6, 2, 3); // nose side
  } else {
    ctx.fillStyle = hair; ctx.fillRect(4, 2, 8, 3);
    ctx.fillStyle = '#20242e';
    ctx.fillRect(6, 6, 1, 2); ctx.fillRect(9, 6, 1, 2);   // eyes
  }
  return canvasTexture(c);
}

const CHARACTER_TEXTURES = {
  down:  makeCharacterTexture('down'),
  up:    makeCharacterTexture('up'),
  left:  makeCharacterTexture('left'),
  right: makeCharacterTexture('right'),
};

// --- placeholder tree ---
function makeTreeTexture() {
  const { c, ctx } = makeCanvas(24, 32);
  ctx.fillStyle = '#4a3423'; ctx.fillRect(10, 20, 4, 12);
  const greens = ['#2f5d34', '#3d7a41', '#4f9550'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = greens[i];
    ctx.fillRect(3 + i, 4 + i * 5, 18 - i * 2, 10 - i);
  }
  return canvasTexture(c);
}

// --- placeholder ground + wall ---
function makeGroundTexture() {
  const { c, ctx } = makeCanvas(32, 32);
  const palette = ['#5c7a3f', '#658545', '#547038', '#6f8f4c'];
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    ctx.fillStyle = palette[(Math.random() * palette.length) | 0];
    ctx.fillRect(x, y, 1, 1);
  }
  const t = canvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(20, 20);
  return t;
}

function makeWallTexture() {
  const { c, ctx } = makeCanvas(16, 16);
  ctx.fillStyle = '#8a7a63'; ctx.fillRect(0, 0, 16, 16);
  ctx.fillStyle = '#6f6250';
  for (let y = 0; y < 16; y += 4) {
    ctx.fillRect(0, y, 16, 1);
    ctx.fillRect((y / 4) % 2 ? 4 : 11, y, 1, 4);
  }
  const t = canvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* ============================================================
   3. BILLBOARD SPRITE
   A lit, shadow-casting plane. NOT THREE.Sprite — that class
   ignores lighting and won't give you the look.
   alphaTest (not alpha blending) keeps pixel edges hard and
   lets the plane cast a correct cut-out shadow.
   ============================================================ */
class BillboardSprite extends THREE.Mesh {
  constructor(texture, worldWidth, worldHeight) {
    const material = new THREE.MeshLambertMaterial({
      map: texture,
      transparent: false,
      alphaTest: 0.5,
      side: THREE.DoubleSide,
    });
    super(new THREE.PlaneGeometry(worldWidth, worldHeight), material);
    // Geometry is centered; shift up so position.y sits at the sprite's feet.
    this.geometry.translate(0, worldHeight / 2, 0);
    this.castShadow = true;
    this.receiveShadow = false;
  }

  // Cylindrical billboarding: rotate on Y only. Full lookAt() would
  // tilt the sprite as the camera pitches and break the illusion.
  faceCamera(cam) {
    this.rotation.y = Math.atan2(
      cam.position.x - this.position.x,
      cam.position.z - this.position.z
    );
  }

  setTexture(texture) {
    if (this.material.map !== texture) {
      this.material.map = texture;
      this.material.needsUpdate = true;
    }
  }
}

const billboards = [];
function addBillboard(texture, w, h, x, z) {
  const b = new BillboardSprite(texture, w, h);
  b.position.set(x, 0, z);
  scene.add(b);
  billboards.push(b);
  return b;
}

/* ============================================================
   4. WORLD BLOCKOUT
   Octopath's environments are simple low-poly geometry. Almost all
   the richness comes from light, shadow and sprite dressing on top.
   Swap this whole section for a JSON-driven level loader later.
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshLambertMaterial({ map: makeGroundTexture() })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const wallTexture = makeWallTexture();
function addBuilding(x, z, w, h, d) {
  const tex = wallTexture.clone();
  configurePixelTexture(tex);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(w, h);
  tex.needsUpdate = true;

  const box = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshLambertMaterial({ map: tex })
  );
  box.position.set(x, h / 2, z);
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(Math.max(w, d) * 0.82, h * 0.55, 4),
    new THREE.MeshLambertMaterial({ color: 0x8c4a3a })
  );
  roof.position.set(x, h + h * 0.275, z);
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  scene.add(roof);
}

addBuilding(-7, -5, 5, 4, 5);
addBuilding(6, -7, 4, 3, 4);
addBuilding(9, 2, 4, 5, 4);
addBuilding(-9, 6, 5, 3, 4);

const treeTexture = makeTreeTexture();
for (let i = 0; i < 22; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 13 + Math.random() * 16;
  addBillboard(treeTexture, 3, 4, Math.cos(a) * r, Math.sin(a) * r);
}

/* ============================================================
   5. LIGHTING RIG
   Hemisphere fill + one shadow-casting key light + transient
   point lights for VFX. That third one is the Octopath trick:
   the devs added a point light alongside each combat effect so
   characters threw real shadows onto the environment.
   ============================================================ */
const hemi = new THREE.HemisphereLight(LOOK.skyColor, LOOK.groundBounce, LOOK.ambientIntensity);
scene.add(hemi);

const sun = new THREE.DirectionalLight(LOOK.sunColor, LOOK.sunIntensity);
sun.position.set(-12, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.02;
scene.add(sun);
scene.add(sun.target);

const impactLights = [];
function spawnImpactLight(position) {
  const light = new THREE.PointLight(
    new THREE.Color(LOOK.impactColor),
    LOOK.impactIntensity,
    LOOK.impactDistance,
    2
  );
  light.position.copy(position).add(new THREE.Vector3(0, 1.1, 0));
  light.castShadow = true;
  light.shadow.mapSize.set(512, 512);
  scene.add(light);
  impactLights.push({ light, life: LOOK.impactDecayTime, max: LOOK.impactDecayTime });
}

function updateImpactLights(dt) {
  for (let i = impactLights.length - 1; i >= 0; i--) {
    const fx = impactLights[i];
    fx.life -= dt;
    if (fx.life <= 0) {
      scene.remove(fx.light);
      fx.light.dispose();
      impactLights.splice(i, 1);
    } else {
      const t = fx.life / fx.max;
      fx.light.intensity = LOOK.impactIntensity * t * t;
    }
  }
}

/* ============================================================
   6. PLAYER + CAMERA RIG
   The sprite always faces the camera; which FRAME is drawn depends
   on the movement direction relative to the camera. That's how you
   keep authored 4/8-way pixel art correct under a rotating camera.
   ============================================================ */
const player = addBillboard(CHARACTER_TEXTURES.down, 1.5, 2.1, 0, 0);
let facing = 'down';

let cameraYaw = 0;
const keys = new Set();
addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (e.code === 'Space') { e.preventDefault(); spawnImpactLight(player.position); }
});
addEventListener('keyup', (e) => keys.delete(e.code));

const MOVE_SPEED = 6;
const ORBIT_SPEED = 1.6;

function updatePlayer(dt) {
  if (keys.has('KeyQ')) cameraYaw -= ORBIT_SPEED * dt;
  if (keys.has('KeyE')) cameraYaw += ORBIT_SPEED * dt;

  // Camera-relative input axes.
  const fwd   = new THREE.Vector2(-Math.sin(cameraYaw), -Math.cos(cameraYaw));
  const right = new THREE.Vector2( Math.cos(cameraYaw), -Math.sin(cameraYaw));

  let ix = 0, iy = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    iy += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  iy -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  ix -= 1;

  const move = new THREE.Vector2(
    fwd.x * iy + right.x * ix,
    fwd.y * iy + right.y * ix
  );

  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(MOVE_SPEED * dt);
    player.position.x += move.x;
    player.position.z += move.y;

    // Project movement onto screen axes to pick the sprite frame.
    const screenRight = move.x * Math.cos(cameraYaw) - move.y * Math.sin(cameraYaw);
    const screenAway  = -move.x * Math.sin(cameraYaw) - move.y * Math.cos(cameraYaw);
    facing = Math.abs(screenAway) > Math.abs(screenRight)
      ? (screenAway > 0 ? 'up' : 'down')
      : (screenRight > 0 ? 'right' : 'left');
    player.setTexture(CHARACTER_TEXTURES[facing]);
  }

  // Keep the key light's shadow frustum centered on the player.
  sun.position.set(player.position.x - 12, 18, player.position.z + 10);
  sun.target.position.copy(player.position);
}

function updateCamera() {
  const pitch = THREE.MathUtils.degToRad(LOOK.cameraPitch);
  const horizontal = Math.cos(pitch) * LOOK.cameraDistance;
  const height = Math.sin(pitch) * LOOK.cameraDistance;
  camera.position.set(
    player.position.x + Math.sin(cameraYaw) * horizontal,
    height,
    player.position.z + Math.cos(cameraYaw) * horizontal
  );
  camera.lookAt(player.position.x, player.position.y + 1.0, player.position.z);
}

/* ============================================================
   7. POST-PROCESSING
   RenderPass -> Bloom -> TiltShift(H) -> TiltShift(V) -> Output.
   OutputPass must be last: it does tone mapping + sRGB conversion.

   This is a true screen-space tilt-shift (blur ramps with distance
   from a horizontal band), which is closer to the real lens effect
   than depth-based DoF and much cheaper. If you later want blur
   driven by actual scene depth, swap these two passes for a
   BokehPass or the pmndrs 'postprocessing' DepthOfFieldEffect.
   ============================================================ */
const TiltShiftShader = {
  uniforms: {
    tDiffuse:    { value: null },
    direction:   { value: new THREE.Vector2(1, 0) },
    resolution:  { value: new THREE.Vector2(1, 1) },
    focusCenter: { value: LOOK.tiltFocusCenter },
    focusWidth:  { value: LOOK.tiltFocusWidth },
    falloff:     { value: LOOK.tiltFalloff },
    maxBlur:     { value: LOOK.tiltMaxBlur },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 direction;
    uniform vec2 resolution;
    uniform float focusCenter;
    uniform float focusWidth;
    uniform float falloff;
    uniform float maxBlur;
    varying vec2 vUv;

    void main() {
      float d = abs(vUv.y - focusCenter);
      float blur = smoothstep(focusWidth, focusWidth + falloff, d) * maxBlur;

      if (blur < 0.01) {
        gl_FragColor = texture2D(tDiffuse, vUv);
        return;
      }

      vec2 texel = direction / resolution * blur;
      vec4 sum = vec4(0.0);
      sum += texture2D(tDiffuse, vUv - texel * 4.0) * 0.0162162162;
      sum += texture2D(tDiffuse, vUv - texel * 3.0) * 0.0540540541;
      sum += texture2D(tDiffuse, vUv - texel * 2.0) * 0.1216216216;
      sum += texture2D(tDiffuse, vUv - texel * 1.0) * 0.1945945946;
      sum += texture2D(tDiffuse, vUv)               * 0.2270270270;
      sum += texture2D(tDiffuse, vUv + texel * 1.0) * 0.1945945946;
      sum += texture2D(tDiffuse, vUv + texel * 2.0) * 0.1216216216;
      sum += texture2D(tDiffuse, vUv + texel * 3.0) * 0.0540540541;
      sum += texture2D(tDiffuse, vUv + texel * 4.0) * 0.0162162162;
      gl_FragColor = sum;
    }
  `,
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  LOOK.bloomStrength, LOOK.bloomRadius, LOOK.bloomThreshold
);
composer.addPass(bloomPass);

const tiltH = new ShaderPass(TiltShiftShader);
tiltH.uniforms.direction.value.set(1, 0);
composer.addPass(tiltH);

const tiltV = new ShaderPass(THREE.UniformsUtils.clone
  ? { ...TiltShiftShader, uniforms: THREE.UniformsUtils.clone(TiltShiftShader.uniforms) }
  : TiltShiftShader);
tiltV.uniforms.direction.value.set(0, 1);
composer.addPass(tiltV);

composer.addPass(new OutputPass());

function syncTiltUniforms() {
  for (const pass of [tiltH, tiltV]) {
    pass.enabled = LOOK.tiltEnabled;
    pass.uniforms.focusCenter.value = LOOK.tiltFocusCenter;
    pass.uniforms.focusWidth.value = LOOK.tiltFocusWidth;
    pass.uniforms.falloff.value = LOOK.tiltFalloff;
    pass.uniforms.maxBlur.value = LOOK.tiltMaxBlur;
    pass.uniforms.resolution.value.set(innerWidth, innerHeight);
  }
}
syncTiltUniforms();

/* ============================================================
   8. DEBUG GUI
   Tune live, then paste the values back into LOOK. This is the
   fastest way to work with an AI coding assistant, since it can
   write the code but can't see your screen.
   ============================================================ */
const gui = new GUI({ title: 'HD-2D Look' });

const fCam = gui.addFolder('Camera');
fCam.add(LOOK, 'fov', 15, 70, 1).onChange(v => { camera.fov = v; camera.updateProjectionMatrix(); });
fCam.add(LOOK, 'cameraPitch', 15, 80, 1);
fCam.add(LOOK, 'cameraDistance', 6, 30, 0.5);

const fLight = gui.addFolder('Lighting');
fLight.add(LOOK, 'sunIntensity', 0, 4, 0.05).onChange(v => sun.intensity = v);
fLight.addColor(LOOK, 'sunColor').onChange(v => sun.color.set(v));
fLight.add(LOOK, 'ambientIntensity', 0, 2, 0.05).onChange(v => hemi.intensity = v);
fLight.addColor(LOOK, 'skyColor').onChange(v => hemi.color.set(v));
fLight.addColor(LOOK, 'groundBounce').onChange(v => hemi.groundColor.set(v));

const fAtmo = gui.addFolder('Atmosphere');
fAtmo.addColor(LOOK, 'fogColor').onChange(v => { scene.fog.color.set(v); scene.background.set(v); });
fAtmo.add(LOOK, 'fogDensity', 0, 0.12, 0.001).onChange(v => scene.fog.density = v);

const fBloom = gui.addFolder('Bloom');
fBloom.add(LOOK, 'bloomStrength', 0, 3, 0.01).onChange(v => bloomPass.strength = v);
fBloom.add(LOOK, 'bloomRadius', 0, 1.5, 0.01).onChange(v => bloomPass.radius = v);
fBloom.add(LOOK, 'bloomThreshold', 0, 1, 0.01).onChange(v => bloomPass.threshold = v);

const fTilt = gui.addFolder('Tilt-shift');
fTilt.add(LOOK, 'tiltEnabled').onChange(syncTiltUniforms);
fTilt.add(LOOK, 'tiltFocusCenter', 0, 1, 0.01).onChange(syncTiltUniforms);
fTilt.add(LOOK, 'tiltFocusWidth', 0, 0.5, 0.01).onChange(syncTiltUniforms);
fTilt.add(LOOK, 'tiltFalloff', 0.01, 0.6, 0.01).onChange(syncTiltUniforms);
fTilt.add(LOOK, 'tiltMaxBlur', 0, 12, 0.1).onChange(syncTiltUniforms);

const fFx = gui.addFolder('Impact light');
fFx.addColor(LOOK, 'impactColor');
fFx.add(LOOK, 'impactIntensity', 0, 150, 1);
fFx.add(LOOK, 'impactDistance', 1, 25, 0.5);
fFx.add(LOOK, 'impactDecayTime', 0.05, 2, 0.05);

// Dump current settings to the console so you can paste them into LOOK.
gui.add({ copy: () => console.log(JSON.stringify(LOOK, null, 2)) }, 'copy')
   .name('log LOOK to console');

/* ============================================================
   9. MAIN LOOP
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.resolution.set(innerWidth, innerHeight);
  syncTiltUniforms();
});

const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);

  updatePlayer(dt);
  updateCamera();
  updateImpactLights(dt);
  for (const b of billboards) b.faceCamera(camera);

  composer.render();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
